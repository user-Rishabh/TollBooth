version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: tollbooth-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tollbooth}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tollbooth-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  clone-backend:
    build:
      context: ./clone/backend
      dockerfile: Dockerfile
    container_name: tollbooth-clone-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tollbooth}
    ports:
      - "${CLONE_BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tollbooth-net

  clone-frontend:
    build:
      context: ./clone/frontend
      dockerfile: Dockerfile
    container_name: tollbooth-clone-frontend
    environment:
      VITE_CLONE_API_URL: http://localhost:${TOLLBOOTH_MIDDLEWARE_PORT:-8001}
    ports:
      - "${CLONE_FRONTEND_PORT:-3000}:3000"
    networks:
      - tollbooth-net

  tollbooth-middleware:
    build:
      context: ./tollbooth
      dockerfile: middleware/Dockerfile
    container_name: tollbooth-middleware
    environment:
      CLONE_BACKEND_URL: http://clone-backend:8000
    ports:
      - "${TOLLBOOTH_MIDDLEWARE_PORT:-8001}:8001"
    depends_on:
      - clone-backend
    networks:
      - tollbooth-net

  tollbooth-dashboard:
    build:
      context: ./tollbooth/dashboard
      dockerfile: Dockerfile
    container_name: tollbooth-dashboard
    environment:
      VITE_TOLLBOOTH_WS_URL: ws://localhost:${TOLLBOOTH_MIDDLEWARE_PORT:-8001}/tollbooth/live
    ports:
      - "${TOLLBOOTH_DASHBOARD_PORT:-3001}:3001"
    depends_on:
      - tollbooth-middleware
    networks:
      - tollbooth-net

volumes:
  postgres_data:

networks:
  tollbooth-net:
    driver: bridge
