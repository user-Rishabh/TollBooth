<svg width="100%" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="260" rx="16" fill="#0d1b2a"/>

  <text x="60" y="72" font-family="Verdana, Geneva, sans-serif" font-size="44" font-weight="bold" fill="#f2a541" letter-spacing="5">TOLLBOOTH</text>
  <text x="63" y="102" font-family="Verdana, Geneva, sans-serif" font-size="15" fill="#e0e1dd">Every request pays a proof-of-human toll to pass</text>

  <line x1="40" y1="210" x2="1160" y2="210" stroke="#495867" stroke-width="4" stroke-dasharray="24 14"/>

  <g id="ticket" transform="translate(1080,46) rotate(-8)">
    <rect x="0" y="0" width="70" height="36" rx="6" fill="#f2a541" stroke="#0d1b2a" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="70" cy="18" r="6" fill="#0d1b2a"/>
    <animateTransform attributeName="transform" type="rotate" values="-8;4;-8" additive="sum" dur="3s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(600,210)">
    <rect x="-4" y="-72" width="8" height="72" fill="#8d99ae"/>
    <g>
      <rect x="0" y="-78" width="90" height="10" rx="4" fill="#f2a541"/>
      <rect x="6" y="-78" width="18" height="10" fill="#ffffff"/>
      <rect x="44" y="-78" width="18" height="10" fill="#ffffff"/>
      <animateTransform attributeName="transform" type="rotate" values="0;-82;-82;0" keyTimes="0;0.4;0.6;1" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>

  <g>
    <animateMotion path="M 40 210 L 1160 210" dur="8s" repeatCount="indefinite"/>
    <g>
      <circle cx="-40" cy="-38" r="6" fill="#e0e1dd" opacity="0.7">
        <animate attributeName="cy" values="-38;-62;-38" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-30" cy="-40" r="4" fill="#e0e1dd" opacity="0.6">
        <animate attributeName="cy" values="-40;-58;-40" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <rect x="-38" y="-46" width="10" height="16" fill="#495867"/>
      <rect x="-70" y="-34" width="140" height="34" rx="8" fill="#1d9e75"/>
      <rect x="40" y="-50" width="30" height="30" rx="4" fill="#0f6e56"/>
      <circle cx="-45" cy="0" r="10" fill="#2c2c2a"/>
      <circle cx="0" cy="0" r="10" fill="#2c2c2a"/>
      <circle cx="45" cy="0" r="10" fill="#2c2c2a"/>
    </g>
  </g>
</svg>
