<svg width="100%" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="340" rx="16" fill="#0d1b2a" stroke="#1b263b" stroke-width="1"/>

  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#f2a541" stop-opacity="0"/>
    <stop offset="50%" stop-color="#f2a541" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#f2a541" stop-opacity="0"/>
  </linearGradient>
  <rect x="-140" y="0" width="140" height="340" fill="url(#scan)">
    <animate attributeName="x" values="-140;1200" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="60" y="62" font-family="Verdana, Geneva, sans-serif" font-size="40" font-weight="bold" fill="#f2a541" letter-spacing="5">TOLLBOOTH</text>
  <text x="63" y="90" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#e0e1dd">Every request pays a proof-of-human toll to pass</text>

  <g transform="translate(1090,44) rotate(-8)">
    <rect x="0" y="0" width="66" height="34" rx="6" fill="#f2a541" stroke="#0d1b2a" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="66" cy="17" r="6" fill="#0d1b2a"/>
    <animateTransform attributeName="transform" type="rotate" values="-8;4;-8" additive="sum" dur="3s" repeatCount="indefinite"/>
  </g>

  <text x="50" y="168" font-family="Verdana, Geneva, sans-serif" font-size="11" fill="#e2725b" letter-spacing="2">BOT ATTEMPT</text>
  <line x1="40" y1="192" x2="1160" y2="192" stroke="#495867" stroke-width="4" stroke-dasharray="24 14"/>

  <text x="50" y="248" font-family="Verdana, Geneva, sans-serif" font-size="11" fill="#5dcaa5" letter-spacing="2">GENUINE USER</text>
  <line x1="40" y1="272" x2="1160" y2="272" stroke="#495867" stroke-width="4" stroke-dasharray="24 14"/>

  <g transform="translate(650,192)">
    <rect x="-4" y="-56" width="8" height="56" fill="#8d99ae"/>
    <g>
      <rect x="0" y="-62" width="80" height="9" rx="3" fill="#e2725b"/>
      <rect x="6" y="-62" width="16" height="9" fill="#ffffff"/>
      <rect x="40" y="-62" width="16" height="9" fill="#ffffff"/>
      <animateTransform attributeName="transform" type="rotate" values="0;-4;0;4;0" dur="0.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <g>
    <animateMotion path="M 40 192 L 560 192" keyPoints="0;1;1" keyTimes="0;0.62;1" calcMode="linear" dur="6s" repeatCount="indefinite"/>
    <g>
      <rect x="-64" y="-32" width="128" height="32" rx="8" fill="#d85a30"/>
      <rect x="34" y="-46" width="26" height="26" rx="4" fill="#993c1d"/>
      <line x1="-10" y1="-46" x2="-10" y2="-58" stroke="#e2725b" stroke-width="2"/>
      <line x1="4" y1="-46" x2="4" y2="-58" stroke="#e2725b" stroke-width="2"/>
      <circle cx="-10" cy="-58" r="3" fill="#e2725b"/>
      <circle cx="4" cy="-58" r="3" fill="#e2725b"/>
      <circle cx="-40" cy="0" r="10" fill="#2c2c2a"/>
      <circle cx="0" cy="0" r="10" fill="#2c2c2a"/>
      <circle cx="40" cy="0" r="10" fill="#2c2c2a"/>
      <g opacity="0">
        <rect x="-40" y="-96" width="90" height="26" rx="13" fill="#791f1f"/>
        <text x="5" y="-78" font-family="Verdana, sans-serif" font-size="13" font-weight="bold" fill="#f7c1c1" text-anchor="middle">BLOCKED</text>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.65;0.95;1" dur="6s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <g transform="translate(650,272)">
    <rect x="-4" y="-56" width="8" height="56" fill="#8d99ae"/>
    <g>
      <rect x="0" y="-62" width="80" height="9" rx="3" fill="#5dcaa5"/>
      <rect x="6" y="-62" width="16" height="9" fill="#ffffff"/>
      <rect x="40" y="-62" width="16" height="9" fill="#ffffff"/>
      <animateTransform attributeName="transform" type="rotate" values="0;-82;-82;0" keyTimes="0;0.45;0.65;1" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>

  <g>
    <animateMotion path="M 40 272 L 1160 272" dur="8s" repeatCount="indefinite"/>
    <g>
      <circle cx="-40" cy="-38" r="6" fill="#e0e1dd" opacity="0.7">
        <animate attributeName="cy" values="-38;-62;-38" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-30" cy="-40" r="4" fill="#e0e1dd" opacity="0.6">
        <animate attributeName="cy" values="-40;-58;-40" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <rect x="-38" y="-46" width="10" height="16" fill="#495867"/>
      <rect x="-70" y="-34" width="140" height="34" rx="8" fill="#1d9e75"/>
      <rect x="40" y="-50" width="30" height="30" rx="4" fill="#0f6e56"/>
      <circle cx="52" cy="-35" r="4" fill="#e0e1dd"/>
      <circle cx="-45" cy="0" r="10" fill="#2c2c2a"/>
      <circle cx="0" cy="0" r="10" fill="#2c2c2a"/>
      <circle cx="45" cy="0" r="10" fill="#2c2c2a"/>
      <g opacity="0">
        <rect x="-45" y="-100" width="90" height="26" rx="13" fill="#085041"/>
        <text x="0" y="-82" font-family="Verdana, sans-serif" font-size="13" font-weight="bold" fill="#9fe1cb" text-anchor="middle">ALLOWED</text>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.40;0.5;0.68;1" dur="8s" repeatCount="indefinite"/>
